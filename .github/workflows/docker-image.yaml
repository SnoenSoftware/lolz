name: "docker-push"

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        with:
          install: true

      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test PHP runtime before publishing
        run: |
          docker build . -f dockerfiles/Dockerfile --target=cron --load -t lolz:test
          docker run --rm --network none --entrypoint php -w /app lolz:test -d error_reporting=-1 vendor/bin/phpunit --do-not-cache-result

      - name: build and push
        run: make prod
        env:
          DOCKER_BUILD_FLAGS: "--cache-to=type=gha,mode=max --cache-from=type=gha --push"
